<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VendorChain Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--ink:#14181f;--muted:#5b6472;--line:#e3e6eb;--soft:#eef1f5;
  --brand:#1f4fd6;--brand-soft:#e7eefc;--good:#16865a;--good-soft:#e3f4ec;--warn:#b26a00;--warn-soft:#fdf1dc;
  --bad:#c2352b;--bad-soft:#fbe6e4;--violet:#6b46c1;--violet-soft:#efe9fb;--out:#c26a1f;--shadow:0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218;--panel:#171b23;--ink:#e8ebf0;--muted:#99a2b0;--line:#272d38;--soft:#1e232d;
  --brand:#6d97ff;--brand-soft:#1c2843;--good:#3ccf8e;--good-soft:#14301f;--warn:#f0b04a;--warn-soft:#33270f;
  --bad:#ff7a70;--bad-soft:#3a1714;--violet:#a98bff;--violet-soft:#251c3d;--out:#f09a52;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0f1218;--panel:#171b23;--ink:#e8ebf0;--muted:#99a2b0;--line:#272d38;--soft:#1e232d;
  --brand:#6d97ff;--brand-soft:#1c2843;--good:#3ccf8e;--good-soft:#14301f;--warn:#f0b04a;--warn-soft:#33270f;
  --bad:#ff7a70;--bad-soft:#3a1714;--violet:#a98bff;--violet-soft:#251c3d;--out:#f09a52;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 8px 16px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer;font-weight:500}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 10px 6px}
.nav svg{width:16px;height:16px;flex:none}
main{min-width:0}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header .grow{flex:1}
.menu-btn{display:none}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.content{padding:24px;max-width:1320px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:18px;margin:4px 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:16px}
.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c2{grid-template-columns:1.4fr 1fr}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14.5px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:2px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tw table th:first-child,.tw table td:first-child{padding-left:14px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}
.masked{color:var(--muted);letter-spacing:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:80px}
.bar span{display:block;height:100%;background:var(--brand)}
.bar.warn span{background:var(--warn)}.bar.bad span{background:var(--bad)}.bar.good span{background:var(--good)}
/* payment flow */
.cyc{display:grid;grid-template-columns:220px 1fr 150px;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.cyc:hover{background:var(--soft)}
.cyc:last-child{border-bottom:0}
.pipe{display:flex;gap:22px;min-width:0;overflow-x:auto;padding:2px}
.hop{flex:1;min-width:150px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:7px 10px;position:relative;background:var(--panel)}
.hop:not(:last-child)::after{content:"\2192";position:absolute;right:-18px;top:50%;transform:translateY(-50%);color:var(--muted)}
.hop .who{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hop .amt{font-weight:700;font-variant-numeric:tabular-nums}
.hop .st{font-size:12px;font-weight:600}
.hop.good{border-left-color:var(--good)}.hop.good .st{color:var(--good)}
.hop.bad{border-left-color:var(--bad)}.hop.bad .st{color:var(--bad)}
.hop.warn{border-left-color:var(--warn)}.hop.warn .st{color:var(--warn)}
.hop.brand{border-left-color:var(--brand)}.hop.brand .st{color:var(--brand)}
.hop.violet{border-left-color:var(--violet)}.hop.violet .st{color:var(--violet)}
.hop.mute{border-style:dashed;border-left-style:solid}.hop.mute .st{color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* cash chart */
.cf{display:grid;grid-template-columns:90px 1fr 92px;gap:6px 12px;align-items:center;font-size:12.5px}
.cf .lbl{color:var(--muted)}
.cf .bars{display:flex;flex-direction:column;gap:3px}
.cf .b{height:10px;border-radius:3px}
.cf .b.in{background:var(--brand)}.cf .b.out{background:var(--out)}
.cf .v{text-align:right;font-variant-numeric:tabular-nums;line-height:13px}
.cf .v span{display:block}
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .2s;z-index:20;overflow:auto;padding:20px}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;z-index:15}
.scrim.open{display:block}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:12px 0}
.dl dt{color:var(--muted)}.dl dd{margin:0}
.match{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.match div{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:12.5px;color:var(--muted)}
.match b{display:block;font-size:18px;color:var(--ink)}
.timeline{border-left:2px solid var(--line);margin:8px 0 8px 6px;padding-left:16px}
.timeline .ev{position:relative;padding:6px 0}
.timeline .ev::before{content:"";position:absolute;left:-22px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--muted)}
.timeline .ev.good::before{border-color:var(--good);background:var(--good)}
.timeline .ev.bad::before{border-color:var(--bad)}
.timeline .ev.warn::before{border-color:var(--warn)}
.timeline .ev small{display:block;color:var(--muted)}
.form label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.form .ctl{width:100%}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:default}
.alert:last-child{border:0}
.alert.click{cursor:pointer}
.co{display:flex;gap:12px;align-items:flex-start}
.co .lg{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--soft);flex:none}
.hc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.hc div{background:var(--soft);border-radius:8px;padding:6px;text-align:center;font-size:12px;color:var(--muted)}
.hc b{display:block;color:var(--ink);font-size:16px}
.chain{display:flex;align-items:stretch;overflow-x:auto;padding:4px 0 8px}
.node{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:150px;background:var(--panel)}
.node.esg{border:2px solid var(--brand);background:var(--brand-soft)}
.node .t{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.node .n{font-weight:600;margin-top:2px}
.link{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:120px;padding:0 6px;font-size:12px;color:var(--muted);text-align:center}
.link .r{font-weight:700;color:var(--ink);font-size:13px}
.link .arr{width:100%;height:2px;background:var(--line);position:relative;margin:6px 0}
.link .arr:after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--muted)}
.ts input{width:56px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--panel)}
.ts input:disabled{background:var(--soft);color:var(--muted)}
.steps{display:flex;margin:16px 0 4px;flex-wrap:wrap}
.step{flex:1;min-width:140px;display:flex;gap:8px;align-items:flex-start;padding-right:8px}
.step .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--soft);color:var(--muted);flex:none}
.step.done .dot{background:var(--good);color:#fff}.step.cur .dot{background:var(--brand);color:#fff}
.step small{display:block;color:var(--muted)}
.post{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.post:last-child{border:0}
.post .meta{color:var(--muted);font-size:12.5px}
.post .acts{display:flex;gap:12px;margin-top:8px;color:var(--muted);font-size:12.5px}
.post .acts button{background:none;border:0;color:inherit;cursor:pointer;padding:0}
textarea.ctl{width:100%;min-height:70px;resize:vertical}
.matrix td,.matrix th{text-align:center;font-size:12.5px}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.y{color:var(--good);font-weight:700}.n{color:var(--muted)}.p{color:var(--warn);font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);visibility:hidden;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;transition:transform .2s;z-index:30;font-weight:500;max-width:90vw}
.toast.show{transform:translateX(-50%);visibility:visible}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.split div{background:var(--soft);border-radius:8px;padding:10px}
.split small{color:var(--muted);display:block}
.split b{font-size:17px;font-variant-numeric:tabular-nums}

.nb{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700;line-height:16px}
.search{position:relative}.search input{width:260px}
header{flex-wrap:nowrap}header #tenantName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
@media (max-width:1280px){header{flex-wrap:wrap}}
.sres{position:absolute;top:40px;left:0;width:440px;max-height:380px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:12;display:none}
.sres.open{display:block}.sres a{display:block;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;cursor:pointer}.sres a:hover{background:var(--soft);text-decoration:none}.sres a small{display:block;color:var(--muted);font-weight:400}
.bell{position:relative;display:inline-flex;align-items:center;gap:6px}.bell .nb{margin:0}
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:none}.overlay.open{display:block}
.auth{max-width:460px;margin:5vh auto;padding:0 16px}.auth .card{padding:28px}
.authbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;margin-top:10px;padding:11px 14px;text-align:left}.authbtn span{font-size:12.5px;color:var(--muted);font-weight:400}
.otp{display:flex;gap:8px;margin:12px 0}.otp input{width:44px;height:50px;text-align:center;font-size:20px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}.choice button.on{border-color:var(--brand);background:var(--brand-soft)}.choice small{display:block;color:var(--muted);margin-top:2px}
.rsteps{gap:8px}.rsteps .step{min-width:0;flex:1;padding:0}.rsteps .step b{white-space:normal;font-size:12px;line-height:1.25;display:block;margin-top:3px}
.org ul{list-style:none;padding-left:22px;margin:0;border-left:1px solid var(--line)}.org>ul{border:0;padding:0}.org li{padding:6px 0 6px 14px;position:relative}.org li::before{content:"";position:absolute;left:-1px;top:24px;width:14px;border-top:1px solid var(--line)}.org>ul>li::before{display:none}.org>ul>li{padding-left:0}
.person{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel)}
.msgs{display:grid;grid-template-columns:250px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);min-height:400px}
.msgs .list{border-right:1px solid var(--line)}.msgs .list a{display:block;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer}.msgs .list a:hover{text-decoration:none;background:var(--soft)}.msgs .list a.on{background:var(--brand-soft)}
.thread{display:flex;flex-direction:column;min-width:0}.thread .body{flex:1;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:8px;max-height:420px}
.bub{max-width:75%;padding:8px 12px;border-radius:12px;background:var(--soft)}.bub.me{align-self:flex-end;background:var(--brand-soft)}.bub small{display:block;color:var(--muted);font-size:11px}
.toggle{width:36px;height:20px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;flex:none;margin:2px 0 0}.toggle:checked{background:var(--brand)}.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}.toggle:checked::after{left:18px}.toggle:disabled{opacity:.5}
@media(max-width:760px){.msgs{grid-template-columns:1fr}.choice{grid-template-columns:1fr}.search{display:none}}
@media (max-width:1100px){.k6{grid-template-columns:repeat(3,1fr)}.k4{grid-template-columns:repeat(2,1fr)}.c2,.c3{grid-template-columns:1fr}.cyc{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;z-index:25;width:250px;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  .menu-btn{display:inline-block}
  header{padding:10px 16px}
  .content{padding:16px}
  .k6,.k4{grid-template-columns:repeat(2,1fr)}
  .hide-sm{display:none}
  .dl{grid-template-columns:120px 1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="logo"><i>VC</i>VendorChain</div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main>
    <header>
      <button class="btn menu-btn" onclick="toggleSide()">Menu</button>
      <b id="tenantName">Executive Software Guild Inc.</b>
      <div class="search hide-sm" id="searchBox"><input class="ctl" id="q" placeholder="Search invoices, SOWs, people, projects…" oninput="doSearch(this.value)" onfocus="doSearch(this.value)" onblur="setTimeout(()=>document.getElementById('sres').classList.remove('open'),200)" aria-label="Search"><div class="sres" id="sres"></div></div>
      <div class="grow"></div>
      <select class="ctl" id="role" onchange="setRole(this.value)" aria-label="Viewing as (demo role)" title="Demo: switch role">
        <option value="platform">Demo role: Platform owner</option>
        <option value="admin">Tenant admin (ESG)</option>
        <option value="finance">Finance (AR / AP)</option>
        <option value="am">Account manager</option>
        <option value="legal">Contracts / legal</option>
        <option value="vendor">Vendor admin (BrightPath)</option>
        <option value="consultant">Consultant (R. Kumar)</option>
      </select>
      <button class="btn bell" onclick="showNotifs()" title="Alerts and reminders">Alerts <span class="nb" id="bellN"></span></button>
      <select class="ctl hide-sm" aria-label="Public pages" onchange="if(this.value==='login')showLogin();if(this.value==='reg')showRegister();this.value=''"><option value="">Public pages…</option><option value="login">Sign-in screen</option><option value="reg">Registration</option></select>
      <button class="btn" onclick="toggleTheme()" title="Toggle theme">Theme</button>
      <div class="avatar" id="av" onclick="vcLogout()" title="Sign out" style="cursor:pointer">PG</div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"></div>

<script>
/* =====================================================================
   SAMPLE DATA (fictional). "Today" is fixed so the demo is repeatable.
   One source of truth: billing cycles. Each cycle = one placement x one
   period, with a payment "hop" per link in the vendor chain.
   ===================================================================== */
const TODAY='2026-10-10';
const ESG='Executive Software Guild Inc.',BP='BrightPath Tech LLC',OD='Orion Data Partners',NW='Northwind Consulting',MP='Meridian Pharma Inc.',AF='Atlas Foods Corp.';

const cycles=[
 {id:'CY-1042-AUG',pl:'PL-1042',person:'Ravi Kumar',client:MP,period:'Aug 2026',hops:[
   {upstream:true,payer:MP,payee:NW,reported:'2026-09-26'},
   {payer:NW,payee:ESG,inv:'ESG-AR-2026-0389',rate:95,hrs:176,issued:'2026-08-31',due:'2026-10-15',terms:'Net 45',sow:'WO-NW-0388',payments:[{date:'2026-10-01',amt:16720,method:'ACH',ref:'NW-PMT-55120'}]},
   {payer:ESG,payee:BP,inv:'BP-INV-1161',rate:80,hrs:176,issued:'2026-09-02',terms:'Pay-when-paid',pwp:'ESG-AR-2026-0389',sow:'SOW-ESG-BP-014',payments:[{date:'2026-10-02',amt:14080,method:'ACH',ref:'ESG-ACH-1009'}]}]},
 {id:'CY-1042-SEP',pl:'PL-1042',person:'Ravi Kumar',client:MP,period:'Sep 2026',hops:[

   ===================================================================== */
const sum=a=>a.reduce((s,x)=>s+x,0);
const dn=d=>Date.parse(d)/864e5;
const addDays=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=d=>{if(!d||d.length<10)return d||'—';const y=d.slice(0,4);return MON.at(+d.slice(5,7)-1)+' '+(+d.slice(8,10))+(y!=='2026'?', '+y:'');};
const money=n=>(n<0?'-':'')+'$'+Math.round(Math.abs(n)).toLocaleString('en-US');

const isAR=h=>h.payee===ESG;
const isAP=h=>h.payer===ESG&&!h.payroll&&!h.upstream;
const invoiced=h=>h.rate*h.hrs;
const payable=h=>h.rate*(h.apprHrs??h.hrs);
const due$=h=>isAP(h)?payable(h):invoiced(h);
const paid=h=>sum((h.payments||[]).map(p=>p.amt));
const bal=h=>due$(h)-paid(h);
const allHops=()=>cycles.flatMap(c=>c.hops.map(h=>({h,c})));
const arHops=()=>allHops().filter(x=>isAR(x.h));
const apHops=()=>allHops().filter(x=>isAP(x.h));
const findHop=inv=>allHops().find(x=>x.h.inv===inv);

function status(h){
 if(h.upstream)return h.reported?'Client paid prime':'Awaiting client';
 if(h.payroll)return 'W-2 payroll';
 if(bal(h)<=0)return 'Paid';
 if(h.exception)return 'Exception';
 if(h.pwp){const u=findHop(h.pwp).h;if(bal(u)>0)return 'Held';return h.scheduled?'Scheduled':'Ready to pay';}
 if(h.scheduled)return 'Scheduled';
 const over=h.due&&h.due<TODAY;
 if(paid(h)>0)return over?'Overdue (part paid)':'Partially paid';
 if(over)return 'Overdue';
 return isAR(h)?'Awaiting payment':'Due';
}
const tone=s=>({'Paid':'good','Client paid prime':'good','Ready to pay':'brand','Scheduled':'brand','Awaiting payment':'brand','Due':'brand','Partially paid':'violet','Overdue':'bad','Overdue (part paid)':'bad','Exception':'bad','Held':'warn','Awaiting client':'mute','W-2 payroll':'mute'}[s]||'');
const daysLate=h=>h.due&&h.due<TODAY&&bal(h)>0?dn(TODAY)-dn(h.due):0;
const expectedOut=h=>{if(h.scheduled)return h.scheduled;if(h.pwp){const u=findHop(h.pwp).h;return addDays(u.due,3);}return h.due;};
function cycleState(c){
 const st=c.hops.filter(h=>!h.upstream&&!h.payroll).map(status);
 if(st.some(s=>['Overdue','Overdue (part paid)','Exception'].includes(s)))return['Action needed','bad'];
 if(st.every(s=>s==='Paid'))return['Settled','good'];
 if(st.includes('Held'))return['Waiting on customer','warn'];
 return['In progress','brand'];
}
function sowStats(s){
 const hs=allHops().filter(x=>x.h.sow===s.id).map(x=>x.h);
 const inv=s.prior+sum(hs.map(invoiced));
 const pd=s.priorPaid+sum(hs.map(paid));
 return{inv,pd,open:inv-pd,remaining:s.ceiling-inv,burn:Math.round(inv/s.ceiling*100)};
}
const daysLeft=d=>dn(d)-dn(TODAY);
const expTone=d=>{const n=daysLeft(d);return n<0?'bad':n<=60?'bad':n<=120?'warn':'good';};

  ${kpi('MSA / SOW expiring',expSoon,'SOWs ≤ 60 days, MSAs ≤ 90 days')}
 </div>
 <div class="grid c2" style="margin-top:16px">
  <div class="card"><h3>Expected cash in vs out — next 6 weeks</h3>${cashChart(showAP)}</div>
  <div class="card"><h3>Needs attention</h3>${attention()}</div>
 </div>
 <div class="card" style="margin-top:16px"><div class="toolbar" style="margin:0 0 6px"><h3 style="margin:0">Open payment flows</h3><div class="grow"></div><button class="btn sm" onclick="go('flow')">View all</button></div>
  ${cycles.filter(c=>cycleState(c)[0]!=='Settled').slice(0,4).map(cycleRow).join('')}</div>`;

function cashChart(showAP){
 const weeks=[];let w='2026-10-12';for(let i=0;i<6;i++){weeks.push(w);w=addDays(w,7);}
 const bucket=d=>{if(d<TODAY)return 'past';for(let i=weeks.length-1;i>=0;i--)if(d>=weeks.at(i))return weeks.at(i);return weeks.at(0);};
 const rows=[{k:'past',l:'Past due'},...weeks.map(x=>({k:x,l:'Wk of '+fd(x)}))].map(r=>({...r,in:0,out:0}));
 const get=k=>rows.find(r=>r.k===k);
 arHops().filter(x=>bal(x.h)>0).forEach(x=>{const r=get(bucket(x.h.due));if(r)r.in+=bal(x.h);});
 if(showAP)apHops().filter(x=>bal(x.h)>0&&!x.h.exception).forEach(x=>{const r=get(bucket(expectedOut(x.h)));if(r)r.out+=bal(x.h);});
 const mx=Math.max(1,...rows.map(r=>Math.max(r.in,r.out)));
 return `<div class="legend"><span><i style="background:var(--brand)"></i>Expected from clients</span>${showAP?'<span><i style="background:var(--out)"></i>Due to vendors</span>':''}</div>
 <div class="cf">${rows.map(r=>`<span class="lbl">${r.l}</span><div class="bars"><div class="b in" style="width:${r.in/mx*100}%"></div>${showAP?`<div class="b out" style="width:${r.out/mx*100}%"></div>`:''}</div><div class="v"><span>${r.in?money(r.in):'—'}</span>${showAP?`<span style="color:var(--muted)">${r.out?money(r.out):'—'}</span>`:''}</div>`).join('')}</div>
 <p class="note">Vendor dates use the scheduled run, or for pay-when-paid the client invoice due date + 3 days. Exceptions are excluded until resolved.</p>`;
}
function attention(){
 const items=[];
 arHops().filter(x=>daysLate(x.h)>0).forEach(x=>items.push(['bad','Overdue',`${x.h.inv} — ${short(x.h.payer)}`,`${money(bal(x.h))} open · ${daysLate(x.h)} days late`,`recvDetail('${x.h.inv}')`]));
 if(fin())apHops().filter(x=>status(x.h)==='Exception').forEach(x=>items.push(['bad','Exception',`${x.h.inv} — hours mismatch`,`Invoiced ${x.h.hrs} hrs, approved ${x.h.apprHrs} hrs`,`payDetail('${x.h.inv}')`]));
 if(fin())apHops().filter(x=>status(x.h)==='Held').forEach(x=>items.push(['warn','Held',`${x.h.inv} — ${short(x.h.payee)}`,`Pay-when-paid on ${x.h.pwp}`,`payDetail('${x.h.inv}')`]));
 sows.filter(s=>sowVis(s)&&sowStats(s).burn>=90).forEach(s=>items.push(['warn','Ceiling',`${s.id} at ${sowStats(s).burn}% of value`,s.amend?`${s.amend.id}: ${s.amend.status}`:'No amendment raised',`sowDetail('${s.id}')`]));
 msas.filter(m=>daysLeft(m.expiry)<=90).forEach(m=>items.push(['warn','MSA',`${m.id} expires ${fd(m.expiry)}`,m.renew,`msaDetail('${m.id}')`]));
 return items.length?items.map(a=>`<div class="alert click" onclick="${a[4]}">${chip(a[1],a[0])}<div><b>${a[2]}</b><div class="note" style="margin:0">${a[3]}</div></div></div>`).join(''):'<p class="note">Nothing needs attention.</p>';
}
function vendorDash(){

function hopCard(h){
 const s=status(h);const t=tone(s);
 const who=(isAR(h)?'AR · ':isAP(h)?'AP · ':'')+(h.payroll?'ESG → W-2 payroll':`${short(h.payer)} → ${short(h.payee)}`);
 const amt=h.upstream?'<span class="note" style="margin:0">Not a party</span>':h.payroll?'<span class="note" style="margin:0">ADP payroll</span>':amtVis(h)?money(due$(h)):mask;
 const date=h.upstream?(h.reported?fd(h.reported):'not reported'):h.payroll?'':bal(h)<=0?'paid '+fd(h.payments.at(-1).date):h.pwp&&s==='Held'?'after client pays':'due '+fd(h.scheduled||h.due);
 return `<div class="hop ${t}"><div class="who">${who}</div><div class="amt">${amt}</div><div class="st">${s}${date?` <span style="color:var(--muted);font-weight:400">· ${date}</span>`:''}</div></div>`;
}
function cycleRow(c){
 const [st,t]=cycleState(c);
 const ar=c.hops.find(isAR),ap=c.hops.find(isAP);
 const m=fin()&&ar&&ap?`<div class="note" style="margin:2px 0 0">Margin ${money(invoiced(ar)-payable(ap))}</div>`:'';
 return `<div class="cyc" onclick="flowDetail('${c.id}')"><div><b>${c.person}</b><div class="note" style="margin:0">${c.period} · ${c.pl} · ${ar?ar.hrs:''} hrs</div><div class="note" style="margin:0">${short(c.client)}</div></div>
  <div class="pipe">${c.hops.map(hopCard).join('')}</div><div style="text-align:right">${chip(st,t)}${m}</div></div>`;
}
VIEWS.flow=()=>{
 const f=UI.flowFilter;
 const list=cycles.filter(c=>{const s=cycleState(c)[0];return f==='all'||(f==='open'&&s!=='Settled')||(f==='action'&&(s==='Action needed'||s==='Waiting on customer'))||(f==='settled'&&s==='Settled');});
 const cnt=k=>cycles.filter(c=>{const s=cycleState(c)[0];return k==='all'||(k==='open'&&s!=='Settled')||(k==='action'&&(s==='Action needed'||s==='Waiting on customer'))||(k==='settled'&&s==='Settled');}).length;
 return `<h1>Payment flow</h1><p class="sub">Each row is one billing period for one placement: what ESG bills its customer (AR) and what ESG pays its vendor or contractor (AP). Other layers in the chain are not tracked.</p>
 <div class="tabs">${[['open','Open'],['action','Needs action'],['settled','Settled'],['all','All']].map(([k,l])=>`<button class="${f===k?'on':''}" onclick="UI.flowFilter='${k}';render()">${l} (${cnt(k)})</button>`).join('')}</div>
 <div class="legend"><span><i style="background:var(--good)"></i>Paid</span><span><i style="background:var(--brand)"></i>Awaiting / scheduled</span><span><i style="background:var(--violet)"></i>Part paid</span><span><i style="background:var(--warn)"></i>Held (pay-when-paid)</span><span><i style="background:var(--bad)"></i>Overdue / exception</span></div>
 <div class="card" style="padding:0">${list.map(cycleRow).join('')||'<p class="note" style="padding:16px">No flows in this view.</p>'}</div>`;
};
function flowDetail(id){
 const c=cycles.find(x=>x.id===id);const ar=c.hops.find(isAR),ap=c.hops.find(isAP);
 const ev=[];
 c.hops.forEach(h=>{
  if(h.upstream)return;
  if(h.payroll)return;
  ev.push([h.issued,'',`${h.inv} issued by ${short(h.payee)}`,`${h.hrs} hrs · ${amtVis(h)?money(invoiced(h)):'amount hidden'} · ${h.terms}`]);
  (h.payments||[]).forEach(p=>ev.push([p.date,'good',`${short(h.payer)} paid ${amtVis(h)?money(p.amt):''} on ${h.inv}`,`${p.method} · ref ${p.ref}`]));
  const s=status(h);
  if(['Overdue','Overdue (part paid)'].includes(s))ev.push([h.due,'bad',`${h.inv} became overdue`,`${daysLate(h)} days late today`]);
  if(s==='Held')ev.push([TODAY,'warn',`${h.inv} held`,`Released when ${h.pwp} is paid`]);
  if(s==='Exception')ev.push([TODAY,'bad',`${h.inv} failed three-way match`,`Invoiced ${h.hrs} hrs vs ${h.apprHrs} approved`]);
 });
 ev.sort((a,b)=>a[0]<b[0]?-1:1);
 openDrawer(`<h2>${c.person} · ${c.period}</h2><div>${chip(...cycleState(c))} <span class="note">${c.pl} · ${c.client}</span></div>
 <div class="pipe" style="margin:14px 0;flex-direction:column;gap:8px">${c.hops.map(hopCard).join('').replace(/class="hop /g,'style="flex:none" class="hop ')}</div>
 ${fin()&&ar&&ap?`<div class="split"><div><small>Billed to ${short(ar.payer)}</small><b>${money(invoiced(ar))}</b><small>${money(paid(ar))} received</small></div><div><small>Owed to ${short(ap.payee)}</small><b>${money(payable(ap))}</b><small>${money(paid(ap))} paid</small></div></div><p class="note">Margin on this period: ${money(invoiced(ar)-payable(ap))} (${Math.round((invoiced(ar)-payable(ap))/invoiced(ar)*100)}%). Cash position today: ${money(paid(ar)-paid(ap))}.</p>`:''}
 <h3 style="margin-top:16px">Timeline</h3><div class="timeline">${ev.map(e=>`<div class="ev ${e[1]}"><b>${e[2]}</b><small>${e[0]==='9999'?'Pending':fd(e[0])} · ${e[3]}</small></div>`).join('')}</div>
 <div class="toolbar" style="margin-top:12px">${ar&&bal(ar)>0&&canPay()?`<button class="btn pri" onclick="recordForm('${ar.inv}')">Record client payment</button>`:''}${ap&&bal(ap)>0&&canPay()?`<button class="btn" onclick="payDetail('${ap.inv}')">Open vendor invoice</button>`:''}</div>`);
}

function filesBlock(key,canEdit){
 const L=files[key]||[];
 return `<div id="fb-${key}"><h3 style="margin-top:16px">Files (${L.length})</h3>${L.length?`<div class="tw"><table>${L.map((f,i)=>`<tr><td style="white-space:normal"><b>${f.n}</b><div class="note" style="margin:0">${f.s||''} · ${f.by||'You'} · ${fd(f.d||TODAY)}</div></td><td style="text-align:right"><button class="btn sm" onclick="toast('Download started')">Download</button>${canEdit?` <button class="btn sm" onclick="rmFile('${key}',${i})">Remove</button>`:''}</td></tr>`).join('')}</table></div>`:'<p class="note">No files yet.</p>'}
 ${canEdit?`<label class="btn sm" style="display:inline-block;margin-top:8px">Add files<input type="file" multiple hidden onchange="addFiles('${key}',this)"></label>`:''}</div>`;
}
function refreshFiles(key){const el=document.getElementById('fb-'+key);if(el)el.outerHTML=filesBlock(key,true);}
function addFiles(key,inp){(files[key]=files[key]||[]);[...inp.files].forEach(f=>{const n=f.name.replace(/[<>"'`]/g,'');files[key].push({n,s:Math.max(1,Math.round(f.size/1024))+' KB',by:'You',d:TODAY});logA('Uploaded file',key,n);});refreshFiles(key);toast('File added — virus-scanned and encrypted');}
function rmFile(key,i){const f=files[key].splice(i,1)[0];logA('Removed file',key,f.n+' (kept 30 days in trash)');refreshFiles(key);toast('Removed — recoverable for 30 days');}

function missingItems(){

 consultants.forEach(c=>{
  if(c.type==='W-2'&&c.offer!=='Signed')out.push({sev:'bad',cat:'Agreement',who:c.name,what:'Offer letter not signed',go:`consultDetail('${c.id}')`});

 });

function nextReminder(h){
 const late=daysLate(h);if(late>0){const n=[1,7,15,30,45,60].find(d=>d>late);return n?addDays(h.due,n):addDays(TODAY,7);}
 const pre=addDays(h.due,-7);return pre>TODAY?pre:h.due;
}
function followUps(){
 const L=arHops().filter(x=>bal(x.h)>0).sort((a,b)=>nextReminder(a.h)<nextReminder(b.h)?-1:1);
 return `<div class="tw"><table><tr><th>Invoice</th><th>Customer</th><th class="num">Balance</th><th>Due</th><th>Next automatic reminder</th><th>Owner</th><th></th></tr>${L.map(({h})=>{const late=daysLate(h);return `<tr><td><b>${h.inv}</b></td><td>${h.payer}</td><td class="num">${money(bal(h))}</td><td>${fd(h.due)}${late?`<div class="note" style="margin:0;color:var(--bad)">${late} days late</div>`:''}</td><td>${fd(nextReminder(h))} · ${late?'overdue notice'+(late>=15?' + escalation':''):'courtesy notice'}</td><td>${late>=15?'K. Reddy (finance)':'Auto'}</td><td><button class="btn sm" onclick="remLog.unshift({date:TODAY+' 17:00',to:'${short(h.payer)} AP',what:'Manual follow-up — ${h.inv}',ch:'Email'});logA('Sent follow-up','${h.inv}','Manual reminder');toast('Follow-up sent to ${short(h.payer)} AP')">Send now</button></td></tr>`;}).join('')}</table></div>`;
}

 <label>Rate (from SOW, read-only)</label><input class="ctl" id="iR" readonly>
 <label>Bill to · terms · due date</label><input class="ctl" id="iT" readonly>
 <label>PO / memo</label><input class="ctl" id="iM" placeholder="PO number, cost centre, notes"></div>
 <div class="split"><div><small>Invoice total</small><b id="iTot"></b></div><div><small>Automatic reminders</small><b style="font-size:13px">7 days before, due date, +1, +7, +15 days</b></div></div>
 <div class="toolbar"><div class="grow"></div><button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn" onclick="toast('Draft saved')">Save draft</button><button class="btn pri" onclick="saveInvoice()">Create and send</button></div>`);

}
function invFill(){const s=sows.find(x=>x.id===document.getElementById('iS').value);const r=rateFor(s.id);const m=msas.find(x=>x.id===s.msa);const n=+(m.terms.match(/\d+/)||[30])[0];const h=+document.getElementById('iH').value||0;
 document.getElementById('iR').value=money(r.rate)+'/hr · '+r.person;document.getElementById('iT').value=`${s.party} · ${m.terms} · due ${fd(addDays(TODAY,n))}`;document.getElementById('iTot').textContent=money(h*r.rate);}
function saveInvoice(){
 const s=sows.find(x=>x.id===document.getElementById('iS').value);const r=rateFor(s.id);const m=msas.find(x=>x.id===s.msa);const n=+(m.terms.match(/\d+/)||[30])[0];const hrs=+document.getElementById('iH').value||0;
 if(!hrs){toast('Enter approved hours');return;}
 const no='ESG-AR-2026-0'+(417+cycles.filter(c=>c.id.startsWith('CY-NEW')).length);
 const hops=[];if(s.party===NW)hops.push({upstream:true,payer:MP,payee:NW,reported:null});
 hops.push({payer:s.party,payee:ESG,inv:no,rate:r.rate,hrs,issued:TODAY,due:addDays(TODAY,n),terms:m.terms,sow:s.id,payments:[]});
 cycles.push({id:'CY-NEW-'+no.slice(-3),pl:r.pl,person:r.person,client:s.party===NW?MP:s.party,period:document.getElementById('iP').value,hops});
 remLog.unshift({date:TODAY+' 17:10',to:short(s.party)+' AP',what:`Invoice ${no} sent (${money(hrs*r.rate)})`,ch:'Email + portal'});
 logA('Created invoice',no,`${s.id} · ${hrs} hrs × ${money(r.rate)} = ${money(hrs*r.rate)}`);
 closeDrawer();UI.recvTab='open';go('recv');toast(`${no} created and sent to ${short(s.party)}`);
}

 ${adm&&st==='Submitted'?`<div class="form"><label>Reason (required to reject)</label><input class="ctl" id="tsReason" placeholder="e.g. Saturday hours not approved by client"></div><div class="toolbar" style="margin-top:12px"><div class="grow"></div><button class="btn" onclick="tsReject('${t.id}','pb')">Reject — Placed By</button><button class="btn pri" onclick="tsApprove('${t.id}','pb')">${v.some(x=>x.ok!==true)?'Approve — Placed By (after review)':'Approve — Placed By'}</button></div><p class="note">After the Placed By approval the timesheet is routed to the End Client approver${tsEndClient(t)?' ('+short(tsEndClient(t))+')':''} via the approvals queue.</p>`:''}
 ${adm&&st==='Approved'?`<div class="toolbar"><button class="btn" onclick="toast('Adjustment opened — changes need approval again')">Request adjustment</button></div>`:''}`);
}
function tsApprove(id,party){party=party||'pb';const t=timesheets.find(x=>x.id===id);if(!t)return;
 if(party==='pb'&&!tsEndClient(t))tsDecide(t,'ec',true,'ESG (internal — no client)');
 const by=party==='pb'?tsPlacedBy(t)+' admin':(tsEndClient(t)?tsEndClient(t)+' approver':'ESG (internal)');
 const st=tsDecide(t,party,true,by);
 approvals=approvals.filter(a=>!(a.type==='Timesheet'&&a.ref.startsWith(t.who)));
 const left=party==='pb'?'ec':'pb';
 if(st==='Submitted')approvals.push({id:'AP-TS-'+Date.now(),type:'Timesheet',ref:t.who+' · wk '+WEEKS[t.week].split(' – ')[0],detail:tsTotal(t)+' hrs '+[...new Set(tsRows(t).map(r=>projOf(r.pl)))].join(' + '),by:t.who,step:(left==='ec'?'End Client — ':'Placed By — ')+short(left==='ec'?(tsEndClient(t)||''):tsPlacedBy(t)),amt:null,party:left});
 logA('Approved timesheet — '+(party==='pb'?'Placed By':'End Client'),t.who+' · week of '+WEEKS[t.week],tsTotal(t)+' h');closeDrawer();renderNav();render();toast(st==='Approved'?`${t.who}: ${tsTotal(t)} h approved by Placed By and End Client — locked`:`Approved by ${party==='pb'?'Placed By':'End Client'} — waiting for the ${party==='pb'?'End Client':'Placed By'}`);}
function tsReject(id,party){party=party||'pb';const r=val('tsReason');if(!r){toast('Enter a reason so the consultant knows what to fix');return;}const t=timesheets.find(x=>x.id===id);if(!t)return;tsDecide(t,party,false,'',r);if(!t.live)t.reason=r;approvals=approvals.filter(a=>!(a.type==='Timesheet'&&a.ref.startsWith(t.who)));logA('Rejected timesheet — '+(party==='pb'?'Placed By':'End Client'),t.who+' · week of '+WEEKS[t.week],r);closeDrawer();render();toast('Returned to '+t.who);}
function bulkApprove(){const L=timesheets.filter(t=>t.week===(UI.tsWeek??1)&&tsStatus(t)==='Submitted'&&vSum(validate(t))[1]==='good');L.forEach(t=>tsApprove(t.id,'pb'));render();if(L.length)toast(L.length+' timesheet(s) approved by Placed By — now with the End Clients');}
function tsSubmitWeek(){
 const t=timesheets.find(x=>x.live);
 tsWeek.status='Submitted';tsWeek.pbSt='Pending';tsWeek.ecSt='Pending';delete tsWeek.pbNote;delete tsWeek.ecNote;
 t.sub='Oct 10, now';
 const pb=tsPlacedBy(t),ec=tsEndClient(t);
 approvals.push({id:'AP-TS-'+Date.now(),type:'Timesheet',ref:t.who+' · wk Oct 4',detail:tsTotal(t)+' hrs '+[...new Set(tsWeek.rows.map(r=>r.proj))].join(' + '),by:t.who,step:'Placed By — '+short(pb),amt:null,party:'pb'});
 logA('Submitted timesheet',t.who+' · week of Oct 4 — routed to Placed By ('+short(pb)+') and End Client ('+short(ec||'—')+')',tsTotal(t)+' h',t.who);
 renderNav();render();toast('Submitted to Placed By and End Client');
}
function myTimesheet(){
 const days=['Sun 4','Mon 5','Tue 6','Wed 7','Thu 8','Fri 9','Sat 10'];const locked=['Submitted','Approved'].includes(tsWeek.status);
 const colT=days.map((_,d)=>sum(tsWeek.rows.map(r=>+r.h[d]||0)));const tot=sum(colT);
 const t=timesheets.find(x=>x.live);const pb=tsPlacedBy(t),ec=tsEndClient(t);
 const pbS=tsPb(t),ecS=tsEc(t);
 const idx={Draft:0,Rejected:0,Submitted:pbS==='Approved'?2:1,Approved:4}[tsWeek.status];
 const steps=[['You','Enter and submit hours'],['Placed By — '+short(pb),'Reviews and approves'],['End Client — '+short(ec||'—'),'Reviews and approves'],['Locked','Feeds invoicing']];
 const banner=tsWeek.status==='Approved'?'Approved by both '+short(pb)+' (Placed By) and '+short(ec||'ESG')+' (End Client) — locked.':tsWeek.status==='Submitted'?(pbS==='Approved'?'Placed By approved — waiting for End Client ('+short(ec||'—')+').':'Submitted — waiting for '+short(pb)+' (Placed By).'):'';
 return `<h1>My timesheet</h1><p class="sub">Week of Oct 4–10 · hours split across your two projects</p>
 ${tsWeek.status==='Rejected'?tsPartyMap(t).filter(x=>x[2]==='Rejected').map(x=>`<div class="card" style="border-color:var(--bad);margin-bottom:12px"><b>Returned by ${x[0]} (${short(x[1])})</b><div class="note" style="margin:0">${x[3]||'No comments provided.'} — fix and resubmit.</div></div>`).join(''):''}
 <div class="card ts"><div class="tw"><table><tr><th>Project</th>${days.map(d=>`<th class="num">${d}</th>`).join('')}<th class="num">Total</th></tr>
 ${tsWeek.rows.map((r,i)=>`<tr><td><b>${r.proj}</b><div class="note" style="margin:0">${r.client} · ${r.pl}</div></td>${r.h.map((v,d)=>`<td class="num"><input type="number" min="0" max="24" step="0.5" value="${v}" ${locked?'disabled':''} aria-label="${r.proj} ${days[d]}" onchange="tsWeek.rows[${i}].h[${d}]=+this.value;render()"></td>`).join('')}<td class="num"><b>${sum(r.h.map(Number))}</b></td></tr>`).join('')}
 <tr><td><b>Daily total</b></td>${colT.map(t2=>`<td class="num">${t2}</td>`).join('')}<td class="num"><b>${tot}</b></td></tr></table></div>
 ${locked?`<h3 style="margin-top:14px">Approvals</h3><div class="tw"><table><tr><th>Party</th><th>Company</th><th>Status</th><th>Comments</th></tr>
 ${tsPartyMap(t).map(x=>`<tr><td><b>${x[0]}</b></td><td>${short(x[1])}</td><td>${chip(x[2],x[2]==='Approved'?'good':x[2]==='Rejected'?'bad':'brand')}</td><td class="note">${x[2]==='Rejected'?(x[3]||'No comments provided.'):x[2]==='Approved'?((x[4]||'Approved')+(x[5]?' · '+x[5]:'')):'Waiting'}</td></tr>`).join('')}
 </table></div><p class="note">Your timesheet is fully approved only after both the Placed By company and the End Client approve it. A rejection by either returns it to you with their comments.</p>`:''}
 <div class="steps">${steps.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'cur':''}"><span class="dot">${i<idx?'✓':i+1}</span><div><b>${s[0]}</b><small>${s[1]}</small></div></div>`).join('')}</div>
 <div class="toolbar" style="margin-top:12px"><span class="note" style="margin:0">Reminders: Friday 3:00 PM and Monday 9:00 AM until you submit.</span><div class="grow"></div>${locked?`<span class="note">${banner}</span>`:'<button class="btn" onclick="toast(\'Draft saved\')">Save draft</button><button class="btn pri" onclick="tsSubmitWeek()">Submit week</button>'}</div></div>`;
}
{const f=actAppr;actAppr=function(id,ok){const a=approvals.find(x=>x.id===id);if(a&&a.type==='Timesheet'){const t=timesheets.find(x=>x.week===1&&a.ref.startsWith(x.who));if(t){const p=a.party||'pb';if(ok){tsApprove(t.id,p);}else{tsDecide(t,p,false,'','Rejected by '+a.step+' — no comments provided');approvals=approvals.filter(x=>x.id!==id);logA('Rejected timesheet — '+(p==='pb'?'Placed By':'End Client'),t.who+' · week of '+WEEKS[t.week],a.step);renderNav();render();toast('Rejected: '+a.ref);}return;}}f(id,ok);};}

function payStages(cy,c){

 const arS=status(ar);
 if(c.type==='W-2'){
  st.push({l:short(ar.payer)+' pays ESG',ok:arS==='Paid',d:arS==='Paid'?'Paid '+fd(ar.payments.at(-1).date):arS.startsWith('Overdue')?'Overdue — ESG is following up':'Due '+fd(ar.due),info:true});
  st.push({l:'You are paid through payroll',ok:true,d:'Your pay does not wait for the customer'});
  return st;
 }
 st.push({l:short(ar.payer)+' pays ESG',ok:arS==='Paid',d:arS==='Paid'?'Paid '+fd(ar.payments.at(-1).date):arS.startsWith('Overdue')?'Overdue — ESG is following up':arS==='Partially paid'?'Part paid':'Due '+fd(ar.due)});
 const apS=status(ap);const to=c.type==='1099'?'you':short(ap.payee);
 st.push({l:'ESG pays '+to,ok:apS==='Paid',d:apS==='Paid'?'Paid '+fd(ap.payments.at(-1).date):apS==='Held'?'Waiting for the customer to pay ESG (pay-when-paid)':apS==='Exception'?'Hours on the vendor invoice don’t match approved timesheets — being corrected':apS==='Scheduled'?'Scheduled for '+fd(ap.scheduled):'Due '+fd(expectedOut(ap))});
 if(c.type==='C2C')st.push({l:short(ap.payee)+' pays you',ok:null,d:'Handled by your employer — ask them for the date'});
 return st;
}

 if(t==='auth'){

   ${c.type==='C2C'?`<p class="note">Your employer, ${c.employer}, completes your Form I-9 and confirms your eligibility to ESG. Contact them for changes.</p>`:c.type==='1099'?'<p class="note">Independent contractors don’t complete Form I-9 with ESG. Keep your W-9 up to date.</p>':''}</div>
   <div class="card">${filesBlock(c.id,true)}<p class="note">Only you and ESG HR / compliance can see these files.</p></div></div>`;
 }
 if(t==='pol'){

   </table></div><p class="note">Accepting records the date, version, IP address and device.</p></div>
   <div class="card" style="margin-bottom:16px"><h3>Your signed agreements</h3>

/* payment-flow card: upstream link shown, amount dotted, nothing else disclosed */
function hopCard(h){
 if(h.upstream)return `<div class="hop mute"><div class="who">End client → ${short(h.payee)}</div><div class="amt">${mask}</div><div class="st">Not tracked <span style="color:var(--muted);font-weight:400">· not our contract</span></div></div>`;
 const s=status(h);const t=tone(s);
 const who=(isAR(h)?'AR · ':isAP(h)?'AP · ':'')+(h.payroll?'ESG → W-2 payroll':`${short(h.payer)} → ${short(h.payee)}`);
 const amt=h.payroll?'<span class="note" style="margin:0">ADP payroll</span>':amtVis(h)?money(due$(h)):mask;
 const date=h.payroll?'':bal(h)<=0?'paid '+fd(h.payments.at(-1).date):h.pwp&&s==='Held'?'after client pays':'due '+fd(h.scheduled||h.due);
 return `<div class="hop ${t}"><div class="who">${who}</div><div class="amt">${amt}</div><div class="st">${s}${date?` <span style="color:var(--muted);font-weight:400">· ${date}</span>`:''}</div></div>`;
}
