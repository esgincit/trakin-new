[project]
name = "mytrakin-api"
version = "1.0.0"
description = "myTrakIn API — payments, contracts, timesheets and compliance for staffing vendor chains"
requires-python = ">=3.12"

# Vercel finds the FastAPI instance here (zero-config FastAPI deployment).
[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "E501"]  # Depends() in defaults is idiomatic FastAPI; long lines are SQL strings

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
